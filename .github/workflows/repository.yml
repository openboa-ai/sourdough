name: Repository checks

on:
  pull_request:
    branches: [main, 'feat/flow-*']
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  naming:
    name: Contribution names
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.product.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run required repository tests
        run: python3 -I .github/scripts/run_required_tests.py .github/scripts
      - name: Check branch and PR title or final commit subject
        run: python3 -I .github/scripts/check_conventions.py
      - name: Select product checks
        id: product
        run: python3 -I .github/scripts/product_scope.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Get verified tool installers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: 0d6bb15e85183386857bbee873826e85893b7cd6
          persist-credentials: false
          path: controls
      - name: Get candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check changed lines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git -C candidate hash-object -t tree /dev/null)
          else
            base=$(git -C candidate merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          # Use the same text diff for whitespace checks and historical secret scanning.
          printf '%s\n' '* diff whitespace=blank-at-eol,blank-at-eof,space-before-tab' > candidate/.git/info/attributes
          git -C candidate diff --check --no-ext-diff --no-textconv "$base" "$HEAD_SHA" --
      - name: Install pinned tools
        run: |
          bash controls/.github/scripts/install-actionlint.sh
          bash controls/.github/scripts/install-gitleaks.sh
      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          for dir in candidate/.github candidate/.github/workflows; do
            [[ -d "$dir" && ! -L "$dir" ]]
          done
          shopt -s nullglob dotglob
          workflows=(candidate/.github/workflows/*.yml candidate/.github/workflows/*.yaml)
          (( ${#workflows[@]} > 0 ))
          config=$(mktemp "$RUNNER_TEMP/actionlint.XXXXXX")
          printf '{}\n' > "$config"
          for file in "${workflows[@]}"; do
            [[ -f "$file" && ! -L "$file" ]]
            actionlint -config-file "$config" -shellcheck= -pyflakes= - < "$file"
          done
      - name: Scan reachable history and the working directory
        shell: bash
        run: |
          set -euo pipefail
          options=(--config "$GITLEAKS_TRUSTED_CONFIG" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner)
          gitleaks git "${options[@]}" --log-opts="--full-history HEAD" candidate
          gitleaks dir "${options[@]}" candidate

  product:
    name: Product checks
    needs: naming
    if: ${{ needs.naming.outputs.scope != 'none' }}
    runs-on: >-
      ${{ needs.naming.outputs.scope == 'unit' && 'ubuntu-24.04'
          || needs.naming.outputs.scope == 'flow-07' && 'macos-26'
          || 'macos-15' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - name: Install the locked tooling and candidate package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps .
      - name: Check format, lint and fast behavior
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests
          python -I .github/scripts/run_required_tests.py tests/unit
      - name: Verify the connected flow
        if: ${{ needs.naming.outputs.scope != 'unit' }}
        env:
          FLOW: ${{ needs.naming.outputs.scope }}
        run: python -I .github/scripts/run_required_tests.py "tests/flows/$FLOW" test_flow.ConnectedFlow.test_end_to_end

  required:
    name: Required CI
    needs: [naming, hygiene, product]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          NAMING: ${{ needs.naming.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          SCOPE: ${{ needs.naming.outputs.scope }}
          PRODUCT: ${{ needs.product.result }}
        shell: bash
        run: |
          printf 'Contribution names=%s, Repository hygiene=%s\n' "$NAMING" "$HYGIENE"
          [[ "$NAMING" == success && "$HYGIENE" == success ]]
          printf 'scope=%s, Product checks=%s\n' "$SCOPE" "$PRODUCT"
          if [[ "$SCOPE" == none ]]; then
            [[ "$PRODUCT" == skipped ]]
          else
            [[ -n "$SCOPE" && "$PRODUCT" == success ]]
          fi
