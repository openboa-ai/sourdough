[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sourdough"
version = "0.1.0"
requires-python = ">=3.14"

[project.scripts]
sourdough = "sourdough.cli:main"

[tool.setuptools.package-data]
sourdough = ["nautilus-macos-arm64.lock", "storage/migrations/*.sql"]
"sourdough.storage" = ["migrations/*.sql"]
